<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · paste-get</title>
  <link rel="stylesheet" href="settings.css">
  <script src="i18n.js"></script>
  <script src="settings.js" defer></script>
</head>
<body>
  <form id="settings" novalidate>
    <h1 data-i18n="settingsTitle">Settings</h1>

    <section>
      <label for="device_name" data-i18n="nameLabel">This computer's name</label>
      <input id="device_name" name="device_name" maxlength="64" autocomplete="off" required>
      <p class="hint" data-i18n="nameHint">Shown on your phone and on your other computers.</p>
    </section>

    <section>
      <h2 data-i18n="notificationsTitle">Notifications</h2>
      <fieldset>
        <legend data-i18n="notifyLegend">Show one when something arrives:</legend>
        <label class="choice"><input type="radio" name="notify" value="images"> <span data-i18n="notifyImages">Images only</span></label>
        <label class="choice"><input type="radio" name="notify" value="all"> <span data-i18n="notifyAll">Images and text</span></label>
        <label class="choice"><input type="radio" name="notify" value="off"> <span data-i18n="notifyOff">Never</span></label>
      </fieldset>
      <label class="choice"><input type="checkbox" id="offer_to_open_links"> <span data-i18n="links">Offer to open links copied on another device</span></label>
      <p class="hint" data-i18n="codesHint">2FA codes always say they arrived, unless notifications are off. Never with the code itself.</p>
    </section>

    <section>
      <h2 data-i18n="hotkeysTitle">Hotkeys</h2>
      <label for="toggle_pause" data-i18n="pauseLabel">Pause or resume syncing</label>
      <input id="toggle_pause" class="hotkey" placeholder="None" data-i18n-placeholder="hotkeyNone" autocomplete="off" spellcheck="false">
      <label for="send_clipboard" data-i18n="sendLabel">Send the clipboard now</label>
      <input id="send_clipboard" class="hotkey" placeholder="None" data-i18n-placeholder="hotkeyNone" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="hotkeysHint">Click a field and press the keys, such as Ctrl+Alt+Shift+P. Backspace turns it off.</p>
    </section>

    <section id="login_section" hidden>
      <label class="choice"><input type="checkbox" id="start_at_login"> <span data-i18n="login">Start paste-get when I log in</span></label>
    </section>

    <p id="status" class="status" role="status"></p>

    <div class="buttons">
      <button type="button" id="close" data-i18n="close">Close</button>
      <button type="submit" id="save" class="primary" data-i18n="save">Save</button>
    </div>
  </form>
</body>
</html>
