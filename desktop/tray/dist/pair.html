<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair a phone · paste-get</title>
  <link rel="stylesheet" href="pair.css">
  <script src="i18n.js"></script>
  <script src="pair.js" defer></script>
</head>
<body>
  <main>
    <h1 data-i18n="pairTitle">Pair a phone</h1>
    <ol>
      <li data-i18n="pairStep1">On your phone, open paste-get and tap Pair a computer.</li>
      <li data-i18n="pairStep2">Scan this code.</li>
    </ol>
    <div id="code" class="code waiting" aria-label="Pairing QR code" data-i18n="pairPreparing">Preparing the code…</div>
    <p id="status" class="status" data-i18n="pairOnce">The code works once, for a few minutes.</p>
  </main>
</body>
</html>
