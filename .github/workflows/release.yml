name: Release

# Builds the packages people install. A `v*` tag (see docs/RELEASING.md) also puts them in a
# draft GitHub release, published by hand after a last look. Changes to the packaging run the
# builds without releasing, so they're tested before a tag needs them.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # Not evaluated for tags: every tag builds.
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/tray/tauri*.json"
      - "android/app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "=$env:TAURI_CLI_VERSION" --locked
      - name: Build the installer
        shell: bash
        run: packaging/build-desktop.sh nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux:
    name: AppImage, .deb and .rpm
    # The oldest supported Ubuntu: an AppImage runs on systems at least as new as the one it
    # was built on. The .deb and .rpm then need glibc 2.35 or newer too.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install the libraries the tray links to, and rpm to look inside the .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
      - name: Build the packages
        run: packaging/build-desktop.sh appimage,deb,rpm
      - name: Check what the .deb and .rpm install
        run: packaging/linux/check-packages.sh target/release/bundle
      - name: The AppStream metainfo lists this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qF "<release version=\"$version\"" packaging/linux/io.github.nexoryx.pasteget.metainfo.xml || {
            echo "::error::add a <release> for $version to the metainfo: see docs/RELEASING.md"
            exit 1
          }
      - name: Name the packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir dist
          # paste-get_<version>_amd64.AppImage and .deb already; the .rpm the same way.
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/rpm/*.rpm "dist/paste-get_${version}_x86_64.rpm"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  linux-install:
    name: Install the ${{ matrix.package }} on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Debian with WebKitGTK 4.1, and the newest Fedora.
          - image: debian:12
            package: .deb
            install: apt-get update && apt-get install -y ./paste-get_*.deb
          - image: fedora:latest
            package: .rpm
            install: dnf install -y ./paste-get_*.rpm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      # Fails if a dependency has no package of that name on the distribution.
      - name: Install it with its dependencies
        run: ${{ matrix.install }}
      # Fails if a library it links to is missing.
      - name: Both programs start
        run: |
          pasteget --version
          pasteget-tray --version
      - name: The installed desktop entry and AppStream metainfo are valid
        if: matrix.package == '.rpm'
        run: |
          dnf install -y appstream desktop-file-utils
          desktop-file-validate /usr/share/applications/paste-get.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.nexoryx.pasteget.metainfo.xml

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in `if:` directly.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install cargo-ndk and the Android SDK packages
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" "ndk;30.0.16248370" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Refuse to release an unsigned APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY != 'true'
        run: |
          echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing: see docs/RELEASING.md"
          exit 1
      - name: Decode the release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PASTEGET_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: android
        env:
          PASTEGET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASTEGET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASTEGET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease
      - name: Check the signature and name the APK
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir dist
          cd android/app/build/outputs/apk/foss/release
          if [ "$HAS_KEY" = true ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app-foss-release.apk
            cp app-foss-release.apk "$GITHUB_WORKSPACE/dist/paste-get_${version}_foss.apk"
          else
            cp app-foss-release-unsigned.apk "$GITHUB_WORKSPACE/dist/paste-get_${version}_foss-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  aur:
    name: AUR package (makepkg on Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
        with:
          # makepkg clones the repository; it needs the history for pkgver.
          fetch-depth: 0
      - name: Build this commit with the PKGBUILD
        run: |
          useradd -m builder
          # The checkout belongs to root; makepkg clones it as builder.
          su builder -c "git config --global --add safe.directory '*'"
          cp packaging/aur/paste-get-git/PKGBUILD /home/builder/
          # The same PKGBUILD, built from this checkout instead of the default branch.
          sed -i "s|^source=.*|source=(\"git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" \
            /home/builder/PKGBUILD
          chown -R builder /home/builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          su builder -c 'cd ~ && makepkg --syncdeps --noconfirm'
      - name: The committed .SRCINFO matches the PKGBUILD
        run: |
          cd packaging/aur/paste-get-git
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' | diff -u .SRCINFO -

  release:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-install, android, aur]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "paste-get ${GITHUB_REF_NAME#v}" \
            --generate-notes
